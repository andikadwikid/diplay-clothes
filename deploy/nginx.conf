# Edge rate limit for the login endpoint. It lives here (not in the API) so it is shared
# by every backend replica; the limiter inside each replica is only a second line of defence.
limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Product images are uploaded through the API (default limit there: 5 MB).
    client_max_body_size 12m;

    # Docker's embedded DNS. `backend` resolves to *every* replica of the stateless API,
    # and is looked up again every few seconds, so scaling up/down or replacing a replica
    # needs no nginx reload. (Using a variable in proxy_pass is what makes nginx re-resolve.)
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://backend:8080;

    # --- Go backend: JSON API and uploaded images -----------------------------
    # The backend sets its own security/cache headers on these, so none are added here.
    # Nothing is buffered to disk: uploads and images stream straight through.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_request_buffering off;
    }

    location /media/ {
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_buffering off;
    }

    # --- Static app -----------------------------------------------------------
    location /assets/ {
        # Content-hashed filenames: safe to cache for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security_headers.inc;
        try_files $uri =404;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/conf.d/security_headers.inc;
        try_files $uri =404;
    }

    # No favicon yet: answer quietly instead of serving the app shell for it.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Single-page app: unknown paths (/admin, /admin/products/...) get index.html.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security_headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
