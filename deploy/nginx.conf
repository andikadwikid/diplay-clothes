server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Product images are uploaded through the API (default limit there: 5 MB).
    client_max_body_size 12m;

    # --- Go backend: JSON API and uploaded images -----------------------------
    # The backend sets its own security/cache headers on these, so none are added here.
    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /media/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # --- Static app -----------------------------------------------------------
    location /assets/ {
        # Content-hashed filenames: safe to cache for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security_headers.inc;
        try_files $uri =404;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/conf.d/security_headers.inc;
        try_files $uri =404;
    }

    # No favicon yet: answer quietly instead of serving the app shell for it.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Single-page app: unknown paths (/admin, /admin/products/...) get index.html.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security_headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
